name: In-game spore pouch preview
on:
  pull_request:
    branches: [feat/perch-tree-types]
permissions:
  contents: read
jobs:
  screenshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser
        run: |
          npm install --no-save --ignore-scripts playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Capture the game at mobile size
        run: |
          mkdir -p preview
          python3 -m http.server 8000 --bind 127.0.0.1 --directory app/src/main/assets/web &
          cat > .spore-preview.mjs <<'SCRIPT'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({args:['--no-sandbox']});
          try {
            const page = await browser.newPage({viewport:{width:393,height:790},deviceScaleFactor:2,isMobile:true,hasTouch:true});
            await page.route('**/forest-app.js', async route => {
              const original = await route.fetch();
              const setup = `{
                const save = Forest.create(Date.now(),18);
                save.started = true;
                save.settings.reducedMotion = true;
                save.environment.tutorialDone = true;
                save.worldTick = 180;
                save.weather.kind = 'sun';
                save.weather.wind = 5;
                const first = save.individuals[0];
                const species = ['ridley','bonbon','bosong','duri','jureong','neolbi','superbum'];
                const group = new URLSearchParams(location.search).get('group') === '2' ? species.slice(4) : species.slice(0,4);
                save.individuals = group.map((species,index) => ({
                  ...Forest.clone(first),id:'preview-'+index,species,visualStage:3,xp:150,active:true,
                  x:.33+(index%2)*.31,y:.40+Math.floor(index/2)*.20,
                  sporeSac:'preview-'+((index+1)%group.length),shelter:{phase:'outside',since:0}
                }));
                localStorage.setItem('forest-of-space-v1',JSON.stringify(save));
              }`;
              await route.fulfill({response:original,body:setup+String.fromCharCode(10)+(await original.text()).replace('boot();','window.previewScene=scene;boot();')});
            });
            const errors=[], details=[];
            const logImage=(group,buffer)=>{
              const chunks=buffer.toString('base64').match(/.{1,3500}/g);
              for(const [index,chunk] of chunks.entries()) console.log('FOREST_IMAGE '+group+' '+index+' '+chunks.length+' '+chunk);
            };
            page.on('pageerror',error=>errors.push(error.stack));
            for (const group of [1,2]) {
              await page.route('**/scene.js', async route => {
                const original = await route.fetch();
                const check = `
                  globalThis.previewSporeSpecies = new Set();
                  {
                    const draw = ForestScene.prototype.drawSporeSac;
                    ForestScene.prototype.drawSporeSac = function(c,p,size) {
                      previewSporeSpecies.add(p.species);
                      return draw.call(this,c,p,size);
                    };
                  }`;
                await route.fulfill({response:original,body:await original.text()+check});
              });
              await page.goto('http://127.0.0.1:8000/?group='+group,{waitUntil:'networkidle'});
              await page.locator('#enter').click();
              await page.locator('#garden').waitFor({state:'visible'});
              await page.evaluate(()=>document.fonts.ready);
              await page.waitForTimeout(350);
              const count = await page.evaluate(()=>globalThis.previewSporeSpecies.size);
              if(count !== (group === 1 ? 4 : 3)) throw new Error('Unexpected rendered species count: '+count);
              await page.unroute('**/scene.js');
              if(errors.length) throw new Error(errors.join('\\n'));
              await page.screenshot({path:'preview/forest-spore-pouch-'+group+'.png'});
              logImage(group,await page.screenshot({type:'jpeg',quality:78,scale:'css'}));
              for(let index=0;index<count;index++){
                const clip=await page.evaluate(index=>{
                  const scene=window.previewScene,friend=scene.state().individuals[index];
                  scene.camera.z=2;
                  scene.camera.cx=friend.x;
                  scene.camera.cy=friend.y-.034;
                  scene.camera.clamp();
                  scene.draw();
                  const screen=scene.camera.screen(friend),rect=scene.canvas.getBoundingClientRect();
                  return {x:Math.round(rect.left+screen.x-105),y:Math.round(rect.top+screen.y-178),width:210,height:212};
                },index);
                details.push((await page.screenshot({clip,type:'jpeg',quality:94,scale:'css'})).toString('base64'));
              }
            }
            const names=['리들리','엘리시','베이치','두리','코로나','엘레판','슈퍼범'];
            const sheet=await page.evaluate(async({details,names})=>{
              const canvas=document.createElement('canvas');
              canvas.width=872;
              canvas.height=496;
              const c=canvas.getContext('2d');
              c.fillStyle='#f8f5ed';c.fillRect(0,0,canvas.width,canvas.height);
              c.font='13px Pretendard, sans-serif';c.textAlign='center';c.fillStyle='#4b503e';
              for(const [i,b64] of details.entries()){
                const im=new Image();
                im.src='data:image/jpeg;base64,'+b64;
                await im.decode();
                const x=8+(i%4)*216,y=8+Math.floor(i/4)*244;
                c.drawImage(im,x,y,210,212);
                c.fillText(names[i],x+105,y+231);
              }
              return canvas.toDataURL('image/jpeg',.88).split(',')[1];
            },{details,names});
            const detail=Buffer.from(sheet,'base64');
            (await import('node:fs')).writeFileSync('preview/forest-spore-pouch-detail.jpg',detail);
            logImage(3,detail);
          } finally {
            await browser.close();
          }
          SCRIPT
          node .spore-preview.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: forest-spore-pouch-preview
          path: preview/*
          if-no-files-found: error
