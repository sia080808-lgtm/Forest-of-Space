<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>여백의 숲 · 대표 장면 검수</title><style>
@font-face{font-family:Forest;src:url(fonts/GowunDodum-Regular.ttf)}*{box-sizing:border-box}body{margin:0;background:#f6f2e9;color:#344535;font:15px Forest,sans-serif}main{max-width:880px;margin:auto;padding:18px}h1{font-size:23px;margin:0 0 8px}p{line-height:1.5}.sub{color:#697264;font-size:13px}.controls{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}button,select{border:1px solid #bdc5b5;border-radius:12px;padding:10px;background:#fffdf5;color:inherit;font:inherit}button.active{background:#526447;color:white}canvas{width:100%;display:block;border-radius:18px;background:#edeadc}#status{min-height:42px;padding:12px;background:#e0e6d6;border-radius:12px}#pets{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}.pet{padding:12px;border:1px solid #d3dacb;border-radius:12px}.pet p{margin:6px 0;font-size:13px}#events{padding:12px;background:#fffdf5;border-radius:12px;max-height:180px;overflow:auto;font-size:13px}.numbers{font-variant-numeric:tabular-nums}summary{cursor:pointer}iframe{border:0}
</style></head><body><main><h1>대표 장면 검수</h1><p class="sub">별도 시험 정원 · 실제 저장/도감/성장에 반영되지 않아요.<br>원과 범위선은 판정 위치를 보는 검수 도형입니다. 엘리시 잎틈 조건과 엘레판 그늘을 별도 환경에서 검수합니다.</p>
<div class="controls"><select id="scenario" aria-label="대표 장면"><option value="EC01">비 뒤 보습과 돌돌이</option><option value="ELL01">엘리시 잎틈 정원</option><option value="EC03">엘레판 둘의 그늘과 쉼</option><option value="roster">다섯 친구 편성</option></select><button id="reset">처음부터</button></div>
<p class="sub" id="history"></p><canvas id="map" width="390" height="640" aria-label="검수용 정원 위치도"></canvas><p id="status" aria-live="polite"></p>
<div class="controls"><button id="play">재생</button><button id="step">1초 진행</button><button id="ten">10초 진행</button><select id="speed" aria-label="재생 속도"><option value="1">1배</option><option value="5">5배</option><option value="10" selected>10배</option></select><button id="visible" aria-pressed="true">관찰 중</button><button id="storm">강풍 발생</button><button id="layout">배치 회차 변경</button></div><div id="pets"></div><details><summary>원인·전달 기록</summary><p class="sub" id="water"></p><div id="events"></div></details></main>
<script src="world.js"></script><script src="neolbi.js"></script><script src="superbum.js"></script><script src="shelter.js"></script><script src="spatial.js"></script><script src="traits.js"></script><script src="vitals.js"></script><script src="weather-care.js"></script><script src="social.js"></script><script src="objects.js"></script><script src="skills.js"></script><script src="engine.js"></script><script src="stage2-fixtures.js"></script><script src="stage2-review.js"></script></body></html>
